name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    strategy:
      # A failure on one platform should not hide the result of the others.
      fail-fast: false
      matrix:
        # The platforms the release builds for.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
