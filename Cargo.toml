[package]
name = "markoff"
version = "0.9.1"
edition = "2024"
description = "A TUI for tasks stored as markdown files"
license = "GPL-3.0-or-later"
repository = "https://github.com/eckon/markoff"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
croner = { version = "5.0.0", default-features = false, features = ["jiff"] }
deunicode = "1.6.2"
jiff = "1.0.0"
notify = "9.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
strsim = "0.11.1"
tempfile = "3.27.0"
toml = "1.1.8"
unicode-width = "0.2.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
insta = { version = "1.49.0", features = ["filters"] }
portable-pty = "0.9.0"
vt100 = "0.18.1"
