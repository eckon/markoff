[package]
name = "markoff"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A TUI for todos stored as markdown files"
repository = "https://github.com/eckon/markoff"

[dependencies]
color-eyre = "0.6.5"
deunicode = "1.6.2"
jiff = "0.2.38"
notify = "8.2.0"
ratatui = "0.30.2"
tempfile = "3.27.0"
toml = "1.1.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
insta = { version = "1.49.0", features = ["filters"] }
portable-pty = "0.9.0"
vt100 = "0.16.2"
